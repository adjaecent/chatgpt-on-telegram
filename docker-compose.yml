version: '3.8'
services:
  redis:
    image: "redis:alpine"
    restart: unless-stopped

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - REDIS_URI=redis://redis:6379
      - APP_ENV=prod
      - OPENAI_KEY=${OPENAI_KEY}
      - TELEGRAM_BOT_KEY=${TELEGRAM_BOT_KEY}
